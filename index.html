<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Obed Torres & Sofia Vasquez — Nuestra Boda</title>
    <meta name="description" content="Bienvenidos a la boda de Obed Torres y Sofia Vasquez. Encuentra tu mesa aquí.">
    <meta name="theme-color" content="#FDF9F5">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Italiana&family=Montserrat:wght@200;300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --gold: #C6A664;
            --gold-soft: #D4BC8B;
            --gold-light: #E8D5A3;
            --gold-pale: #F0E6CC;
            --gold-dark: #9A7B3C;
            --cream: #FDF9F5;
            --blush: #FAF3EE;
            --blush-soft: #F7ECE4;
            --text-primary: #1A1714;
            --text-secondary: #4A4540;
            --text-muted: #8A837C;
            --text-light: #B5AEA6;
            --white: #FFFFFF;
            --ease-luxury: cubic-bezier(0.23, 1, 0.32, 1);
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Cormorant Garamond', serif;
            background: var(--cream);
            color: var(--text-primary);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* PRELOADER */
        .preloader {
            position: fixed; inset: 0;
            background: var(--cream);
            display: flex; align-items: center; justify-content: center;
            z-index: 10000;
            transition: opacity 1s var(--ease-luxury), visibility 1s var(--ease-luxury);
        }
        .preloader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .preloader-inner { text-align: center; }
        .preloader-ornament { display: flex; align-items: center; justify-content: center; gap: 1rem; margin-bottom: 1.5rem; }
        .preloader-ornament .line { width: 40px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-soft)); animation: lineShimmer 1.5s ease-in-out infinite; }
        .preloader-ornament .line:last-child { background: linear-gradient(90deg, var(--gold-soft), transparent); }
        .preloader-diamond { width: 6px; height: 6px; background: var(--gold); transform: rotate(45deg); animation: diamondPulse 1.5s ease-in-out infinite; }
        .preloader-names { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 400; color: var(--gold); letter-spacing: 0.08em; margin-bottom: 0.8rem; }
        .preloader-text { font-family: 'Montserrat', sans-serif; font-size: 0.55rem; font-weight: 300; letter-spacing: 0.4em; text-transform: uppercase; color: var(--text-muted); }
        @keyframes lineShimmer { 0%, 100% { opacity: 0.3; width: 30px; } 50% { opacity: 1; width: 50px; } }
        @keyframes diamondPulse { 0%, 100% { opacity: 0.3; transform: rotate(45deg) scale(0.8); } 50% { opacity: 1; transform: rotate(45deg) scale(1.1); } }

        /* PARTICLES */
        .particles { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
        .particle { position: absolute; top: -30px; border-radius: 50% 0 50% 0; opacity: 0; animation: particleFall linear infinite; }
        @keyframes particleFall { 0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; } 8% { opacity: 0.4; } 85% { opacity: 0.2; } 100% { transform: translateY(108vh) rotate(540deg) translateX(60px); opacity: 0; } }

        /* HERO */
        .hero {
            min-height: 100vh; min-height: 100dvh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 2.5rem 1.5rem;
            position: relative; overflow: hidden;
            background: linear-gradient(175deg, var(--cream) 0%, var(--blush) 40%, var(--cream) 100%);
        }
        .hero::before {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(ellipse at 20% 10%, rgba(198,166,100,0.05) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 90%, rgba(232,213,204,0.25) 0%, transparent 50%);
            pointer-events: none;
        }
        .hero::after {
            content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 1px; height: 80px;
            background: linear-gradient(to bottom, transparent, var(--gold-soft), transparent);
            opacity: 0; animation: heroLineReveal 1.2s ease 0.3s forwards;
        }
        @keyframes heroLineReveal { from { opacity: 0; height: 0; } to { opacity: 0.6; height: 80px; } }

        .hero-content { position: relative; z-index: 2; max-width: 420px; width: 100%; }

        .hero-ornament { margin-bottom: 2.5rem; opacity: 0; animation: fadeScaleIn 1.2s var(--ease-luxury) 0.5s forwards; }
        .hero-ornament svg { width: 50px; height: 50px; }
        @keyframes fadeScaleIn { from { opacity: 0; transform: scale(0.7); } to { opacity: 1; transform: scale(1); } }

        .hero-label { font-family: 'Montserrat', sans-serif; font-size: 0.6rem; font-weight: 300; letter-spacing: 0.5em; text-transform: uppercase; color: var(--gold); margin-bottom: 2rem; opacity: 0; animation: fadeSlideUp 1s var(--ease-luxury) 0.7s forwards; }

        .hero-names { margin-bottom: 1rem; opacity: 0; animation: fadeSlideUp 1.2s var(--ease-luxury) 0.9s forwards; }
        .hero-name { font-family: 'Playfair Display', serif; font-size: 3.2rem; font-weight: 400; color: var(--text-primary); line-height: 1.15; display: block; }
        .hero-ampersand { font-family: 'Italiana', serif; font-size: 2.2rem; color: var(--gold); display: block; margin: 0.4rem 0; line-height: 1; }

        .hero-date-wrap { margin-top: 2rem; opacity: 0; animation: fadeSlideUp 1s var(--ease-luxury) 1.1s forwards; }
        .hero-date-line { display: flex; align-items: center; justify-content: center; gap: 1rem; margin-bottom: 1rem; }
        .hero-date-line .dl { width: 30px; height: 1px; background: var(--gold-soft); }
        .hero-date-line .dd { width: 4px; height: 4px; background: var(--gold); transform: rotate(45deg); }
        .hero-date { font-family: 'Montserrat', sans-serif; font-size: 0.65rem; font-weight: 300; letter-spacing: 0.3em; text-transform: uppercase; color: var(--text-muted); }

        .hero-welcome { margin-top: 2.5rem; opacity: 0; animation: fadeSlideUp 1s var(--ease-luxury) 1.3s forwards; }
        .hero-welcome-text { font-family: 'Cormorant Garamond', serif; font-size: 1.35rem; font-weight: 300; font-style: italic; color: var(--text-secondary); line-height: 1.7; }
        .hero-welcome-text em { font-weight: 500; color: var(--text-primary); font-style: normal; }

        .hero-cta { margin-top: 3rem; opacity: 0; animation: fadeSlideUp 1s var(--ease-luxury) 1.5s forwards; }

        .btn-luxury {
            position: relative; display: inline-flex; align-items: center; gap: 0.8rem;
            padding: 1.1rem 2.8rem; background: var(--gold); border: none; color: var(--white);
            font-family: 'Montserrat', sans-serif; font-size: 0.65rem; font-weight: 400;
            letter-spacing: 0.25em; text-transform: uppercase; text-decoration: none;
            cursor: pointer; overflow: hidden; transition: all 0.6s var(--ease-luxury);
            box-shadow: 0 8px 40px rgba(198,166,100,0.15);
            border-radius: 50px; -webkit-tap-highlight-color: transparent;
        }
        .btn-luxury::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 50%, rgba(0,0,0,0.05) 100%); pointer-events: none; }
        .btn-luxury::after { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); transition: left 0.7s ease; }
        .btn-luxury:hover::after { left: 100%; }
        .btn-luxury:hover { transform: translateY(-2px); box-shadow: 0 12px 45px rgba(198,166,100,0.35); background: var(--gold-dark); }
        .btn-luxury:active { transform: translateY(0) scale(0.98); transition-duration: 0.1s; }
        .btn-luxury .btn-arrow { display: flex; transition: transform 0.4s var(--ease-luxury); }
        .btn-luxury:hover .btn-arrow { transform: translateX(4px); }

        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(25px); } to { opacity: 1; transform: translateY(0); } }

        /* ============================================
           PDF VIEWER - FULLSCREEN PAGES
        ============================================ */
        .pdf-viewer {
            display: none;
            position: fixed; inset: 0;
            background: var(--cream);
            z-index: 9000;
            flex-direction: column;
        }
        .pdf-viewer.active { display: flex; }

        .pdf-viewer-header {
            flex-shrink: 0;
            padding: 1rem 1rem 0.5rem;
            display: flex; align-items: center; justify-content: space-between;
            background: var(--cream);
            border-bottom: 1px solid rgba(198,166,100,0.1);
            padding-top: calc(1rem + env(safe-area-inset-top, 0px));
        }

        .pdf-viewer-close {
            width: 36px; height: 36px;
            border: none; background: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--text-muted);
            transition: color 0.3s;
            -webkit-tap-highlight-color: transparent;
        }
        .pdf-viewer-close:hover { color: var(--gold); }
        .pdf-viewer-close svg { width: 20px; height: 20px; }

        .pdf-viewer-title {
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            font-weight: 400;
            color: var(--text-primary);
            text-align: center;
        }

        .pdf-viewer-page-indicator {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.55rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--gold);
            min-width: 36px;
            text-align: right;
        }

        .pdf-viewer-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            touch-action: pan-y;
        }

        .pdf-viewer-body canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 10px 60px rgba(26,23,20,0.15);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .pdf-viewer-body .page-loading {
            position: absolute;
            text-align: center;
        }
        .pdf-viewer-body .page-loading .spinner {
            width: 36px; height: 36px;
            border: 2px solid var(--gold-pale);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        .pdf-viewer-body .page-loading p {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.55rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .pdf-viewer-nav {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 0.75rem 1rem;
            padding-bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px));
            background: var(--cream);
            border-top: 1px solid rgba(198,166,100,0.1);
        }

        .pdf-nav-btn {
            width: 44px; height: 44px;
            border: 1px solid var(--gold-soft);
            background: transparent;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            color: var(--gold);
            transition: all 0.3s var(--ease-luxury);
            -webkit-tap-highlight-color: transparent;
        }
        .pdf-nav-btn:hover { background: var(--gold); color: var(--white); border-color: var(--gold); }
        .pdf-nav-btn:active { transform: scale(0.92); }
        .pdf-nav-btn.disabled { opacity: 0.3; pointer-events: none; }
        .pdf-nav-btn svg { width: 18px; height: 18px; }

        .pdf-nav-dots {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .pdf-nav-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--gold-pale);
            transition: all 0.3s var(--ease-luxury);
            cursor: pointer;
        }
        .pdf-nav-dot.active {
            background: var(--gold);
            width: 18px;
            border-radius: 3px;
        }

        .pdf-viewer-footer {
            flex-shrink: 0;
            text-align: center;
            padding: 0.3rem 1rem 0.5rem;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.45rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            color: var(--text-light);
        }

        /* FOOTER */
        .footer {
            padding: 4rem 1.5rem 3rem; text-align: center;
            background: linear-gradient(180deg, var(--cream) 0%, var(--blush) 100%);
            position: relative;
        }
        .footer::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 40px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-soft), transparent); }
        .footer-mono { font-family: 'Italiana', serif; font-size: 2.2rem; color: var(--gold); letter-spacing: 0.12em; margin-bottom: 1rem; }
        .footer-date { font-family: 'Montserrat', sans-serif; font-size: 0.55rem; font-weight: 300; letter-spacing: 0.3em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.6rem; }
        .footer-message { font-family: 'Cormorant Garamond', serif; font-size: 1.05rem; font-style: italic; color: var(--text-secondary); }
        .footer-hearts { margin-top: 1.5rem; }
        .footer-hearts svg { width: 14px; height: 14px; fill: var(--gold-soft); opacity: 0.6; }

        /* DARK MODE */
        @media (prefers-color-scheme: dark) {
            :root { --cream: #141210; --blush: #1E1B18; --blush-soft: #242019; --text-primary: #F0E8DE; --text-secondary: #C0B8AE; --text-muted: #7A7268; --text-light: #5A5248; --white: #1E1B18; }
        }

        /* RESPONSIVE */
        @media (max-width: 374px) { .hero-name { font-size: 2.4rem; } .hero-ampersand { font-size: 1.6rem; } .btn-luxury { padding: 0.9rem 1.8rem; font-size: 0.6rem; } }
        @media (min-width: 375px) and (max-width: 479px) { .hero-name { font-size: 2.8rem; } }
        @media (min-width: 480px) { .hero-name { font-size: 3.5rem; } .hero-ampersand { font-size: 2rem; } .hero { padding: 3rem 2.5rem; } }
        @media (min-width: 768px) { .hero-name { font-size: 4.5rem; } .hero-ampersand { font-size: 2.5rem; } }
        @supports (padding-top: env(safe-area-inset-top)) { .hero { padding-top: calc(2.5rem + env(safe-area-inset-top)); padding-bottom: calc(2.5rem + env(safe-area-inset-bottom)); } }
    </style>
</head>
<body>

    <!-- PRELOADER -->
    <div class="preloader" id="preloader">
        <div class="preloader-inner">
            <div class="preloader-ornament">
                <span class="line"></span>
                <span class="preloader-diamond"></span>
                <span class="line"></span>
            </div>
            <div class="preloader-names">Obed & Sofia</div>
            <div class="preloader-text">Un momento especial</div>
        </div>
    </div>

    <!-- PARTICLES -->
    <div class="particles" id="particles"></div>

    <!-- HERO -->
    <section class="hero">
        <div class="hero-content">
            <div class="hero-ornament">
                <svg viewBox="0 0 60 60" fill="none">
                    <path d="M30 5L45 30L30 55L15 30L30 5Z" stroke="#C6A664" stroke-width="0.8"/>
                    <path d="M30 12L40 30L30 48L20 30L30 12Z" stroke="#C6A664" stroke-width="0.5" opacity="0.5"/>
                    <circle cx="30" cy="30" r="2" fill="#C6A664" opacity="0.6"/>
                </svg>
            </div>
            <p class="hero-label">Nosotros nos casamos</p>
            <div class="hero-names">
                <span class="hero-name">Obed Torres</span>
                <span class="hero-ampersand">&</span>
                <span class="hero-name">Sofia Vasquez</span>
            </div>
            <div class="hero-date-wrap">
                <div class="hero-date-line">
                    <span class="dl"></span>
                    <span class="dd"></span>
                    <span class="dl"></span>
                </div>
                <p class="hero-date">01 · Agosto · 2026</p>
            </div>
            <div class="hero-welcome">
                <p class="hero-welcome-text">
                    <em>¡Bienvenidos!</em><br>
                    Busca tu mesa en la boda
                </p>
            </div>
            <div class="hero-cta">
                <button class="btn-luxury" onclick="openPdfViewer()">
                    <span>Ver Lista de Mesas</span>
                    <span class="btn-arrow">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                    </span>
                </button>
            </div>
        </div>
    </section>

    <!-- PDF VIEWER FULLSCREEN -->
    <div class="pdf-viewer" id="pdfViewer">
        <div class="pdf-viewer-header">
            <button class="pdf-viewer-close" onclick="closePdfViewer()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </button>
            <div class="pdf-viewer-title">Lista de Mesas</div>
            <div class="pdf-viewer-page-indicator" id="pageIndicator">1 / 1</div>
        </div>

        <div class="pdf-viewer-body" id="viewerBody">
            <div class="page-loading" id="pageLoading">
                <div class="spinner"></div>
                <p>Cargando...</p>
            </div>
        </div>

        <div class="pdf-viewer-nav">
            <button class="pdf-nav-btn" id="btnPrev" onclick="prevPage()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
            </button>
            <div class="pdf-nav-dots" id="navDots"></div>
            <button class="pdf-nav-btn" id="btnNext" onclick="nextPage()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18l6-6-6-6"/>
                </svg>
            </button>
        </div>

        <div class="pdf-viewer-footer">Obed Torres & Sofia Vasquez · 01 · 08 · 2026</div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-mono">O & S</div>
        <p class="footer-date">01 · 08 · 2026</p>
        <p class="footer-message">Gracias por celebrar con nosotros</p>
        <div class="footer-hearts">
            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </div>
    </footer>

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const PDF_URL = '/encuentra-tu-mesa.pdf';

        let pdfDoc = null;
        let currentPage = 1;
        let totalPages = 1;
        let renderedPages = {};
        let isRendering = false;
        let touchStartX = 0;

        // PRELOADER
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('preloader').classList.add('hidden');
            }, 1500);
        });

        // PARTICLES
        (function() {
            const c = document.getElementById('particles');
            const n = window.innerWidth < 480 ? 10 : 18;
            for (let i = 0; i < n; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                const s = 6 + Math.random() * 10;
                p.style.cssText = 'left:' + (Math.random()*100) + '%;width:' + s + 'px;height:' + s + 'px;background:' + (Math.random()>0.5?'var(--gold-pale)':'var(--blush-soft)') + ';opacity:' + (0.15+Math.random()*0.2) + ';animation-duration:' + (10+Math.random()*15) + 's;animation-delay:' + (Math.random()*20) + 's;';
                c.appendChild(p);
            }
        })();

        // OPEN VIEWER
        async function openPdfViewer() {
            document.getElementById('pdfViewer').classList.add('active');
            document.body.style.overflow = 'hidden';

            if (!pdfDoc) {
                try {
                    pdfDoc = await pdfjsLib.getDocument(PDF_URL).promise;
                    totalPages = pdfDoc.numPages;
                    currentPage = 1;
                    buildDots();
                    renderCurrentPage();
                } catch (err) {
                    document.getElementById('pageLoading').innerHTML =
                        '<p style="color:var(--text-muted);font-family:Cormorant Garamond,serif;font-style:italic;">No se pudo cargar la lista.</p>';
                }
            } else {
                renderCurrentPage();
            }
        }

        // CLOSE VIEWER
        function closePdfViewer() {
            document.getElementById('pdfViewer').classList.remove('active');
            document.body.style.overflow = '';
        }

        // BUILD NAV DOTS
        function buildDots() {
            const dots = document.getElementById('navDots');
            dots.innerHTML = '';
            for (let i = 1; i <= totalPages; i++) {
                const dot = document.createElement('div');
                dot.className = 'pdf-nav-dot' + (i === 1 ? ' active' : '');
                dot.setAttribute('data-page', i);
                dot.addEventListener('click', () => goToPage(i));
                dots.appendChild(dot);
            }
            updateNav();
        }

        // UPDATE NAV STATE
        function updateNav() {
            document.getElementById('pageIndicator').textContent = currentPage + ' / ' + totalPages;
            document.getElementById('btnPrev').classList.toggle('disabled', currentPage <= 1);
            document.getElementById('btnNext').classList.toggle('disabled', currentPage >= totalPages);

            document.querySelectorAll('.pdf-nav-dot').forEach((dot, idx) => {
                dot.classList.toggle('active', idx + 1 === currentPage);
            });
        }

        // RENDER PAGE
        async function renderCurrentPage() {
            if (isRendering || !pdfDoc) return;
            isRendering = true;

            const body = document.getElementById('viewerBody');
            const loading = document.getElementById('pageLoading');

            if (loading) loading.style.display = '';
            body.querySelectorAll('canvas').forEach(c => c.remove());

            try {
                const page = await pdfDoc.getPage(currentPage);
                const baseViewport = page.getViewport({ scale: 1 });
                const availW = body.clientWidth - 24;
                const availH = body.clientHeight - 24;
                const scaleW = availW / baseViewport.width;
                const scaleH = availH / baseViewport.height;
                const dpr = Math.min(window.devicePixelRatio || 1, 3);
                const scale = Math.min(scaleW, scaleH) * dpr;
                const viewport = page.getViewport({ scale: scale });

                const canvas = document.createElement('canvas');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                canvas.style.maxWidth = '100%';
                canvas.style.maxHeight = '100%';

                if (loading) loading.style.display = 'none';
                body.appendChild(canvas);

                const ctx = canvas.getContext('2d');
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                await page.render({ canvasContext: ctx, viewport: viewport }).promise;

                renderedPages[currentPage] = true;
            } catch (err) {
                if (loading) {
                    loading.innerHTML = '<p style="color:var(--text-muted);font-style:italic;">Error al renderizar</p>';
                }
            }

            isRendering = false;
            updateNav();
        }

        // NAVIGATION
        function goToPage(n) {
            if (n < 1 || n > totalPages || n === currentPage) return;
            currentPage = n;
            renderCurrentPage();
        }

        function nextPage() { goToPage(currentPage + 1); }
        function prevPage() { goToPage(currentPage - 1); }

        // SWIPE GESTURE
        const viewerBody = document.getElementById('viewerBody');
        viewerBody.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
        }, { passive: true });

        viewerBody.addEventListener('touchend', (e) => {
            const diff = touchStartX - e.changedTouches[0].clientX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) nextPage();
                else prevPage();
            }
        }, { passive: true });

        // KEYBOARD NAV
        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('pdfViewer').classList.contains('active')) return;
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextPage();
            if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevPage();
            if (e.key === 'Escape') closePdfViewer();
        });
    </script>

</body>
</html>
